services:
  pi-clock:
    build: .
    container_name: pi-clock
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - pi-clock-data:/app/data
    # Optional env var overrides — or configure everything via the web UI at /settings
    # environment:
    #   - TIMEZONE=Asia/Jerusalem
    #   - LATITUDE=31.77
    #   - LONGITUDE=35.23
    #   - GEONAME_ID=281184

volumes:
  pi-clock-data:
